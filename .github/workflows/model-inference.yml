name: Model Inference

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tensorflow keras pillow numpy

      - name: Test model inference
        run: python .github/scripts/test_model.py
